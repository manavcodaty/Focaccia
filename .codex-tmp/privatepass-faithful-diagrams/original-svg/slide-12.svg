/g></g><g xmlns:ns4="http://www.w3.org/2000/svg" ns4:clip-path="url(#story-frame-12)"><g stroke-linecap="round"><g transform="translate(800 130) rotate(0 0 277.5)"><path d="M0 0 C-1.09 114.2, -0.18 227.74, 0 555" stroke="#202020" stroke-width="2.5" fill="none" stroke-dasharray="8 10"/></g></g><mask/></g><g xmlns:ns5="http://www.w3.org/2000/svg" ns5:clip-path="url(#story-frame-12)"><g transform="translate(85.28012084960938 300) rotate(0 344.7198791503906 100)"><text x="344.7198791503906" y="28.192" font-family="Virgil, Segoe UI Emoji" font-size="32px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Ticket claims, ownership, capacity, access</text><text x="344.7198791503906" y="68.19200000000001" font-family="Virgil, Segoe UI Emoji" font-size="32px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Retries without unwanted duplicates</text><text x="344.7198791503906" y="108.19200000000001" font-family="Virgil, Segoe UI Emoji" font-size="32px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Pass authenticity + reused-ticket rejection</text><text x="344.7198791503906" y="148.192" font-family="Virgil, Segoe UI Emoji" font-size="32px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Signed sync + cancellation refresh</text><text x="344.7198791503906" y="188.192" font-family="Virgil, Segoe UI Emoji" font-size="32px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">iPhone launch + local Wi-Fi</text></g></g><g xmlns:ns6="http://www.w3.org/2000/svg" ns6:clip-path="url(#story-frame-12)"><g transform="translate(885.72509765625 300) rotate(0 304.27490234375 75)"><text x="304.27490234375" y="26.43" font-family="Virgil, Segoe UI Emoji" font-size="30px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Full phone journey: no final receipt</text><text x="304.27490234375" y="63.93" font-family="Virgil, Segoe UI Emoji" font-size="30px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Accuracy: no genuine / impostor trials</text><text x="304.27490234375" y="101.43" font-family="Virgil, Segoe UI Emoji" font-size="30px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Spoofing: no photo, screen or mask trials</text><text x="304.27490234375" y="138.93" font-family="Virgil, Segoe UI Emoji" font-size="30px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Real use: no queue timings or user study</text></g></g><g xmlns:ns7="http://www.w3.org/2000/svg" ns7:clip-path="url(#story-frame-12)"><g transform="translate(316.6562194824219 705) rotate(0 483.3437805175781 21.25)"><text x="483.3437805175781" y="29.954" font-family="Virgil, Segoe UI Emoji" font-size="34px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Bugs fixed: crop rules, safe retries, save before success</text></g></g><g xmlns:ns8="http://www.w3.org/2000/svg" ns8:clip-path="url(#story-frame-12)"><g transform="translate(341.0680847167969 775) rotate(0 458.9319152832031 21.25)"><text x="458.9319152832031" y="29.954" font-family="Virgil, Segoe UI Emoji" font-size="34px" fill="#b4493d" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Software checks do not prove the full physical journey</text></g></g></svg>