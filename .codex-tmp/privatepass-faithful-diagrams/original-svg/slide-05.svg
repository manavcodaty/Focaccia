form="translate(194.82504272460938 575) rotate(0 125.17495727539062 37.5)"><text x="125.17495727539062" y="26.43" font-family="Virgil, Segoe UI Emoji" font-size="30px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Josefsson &amp;</text><text x="125.17495727539062" y="63.93" font-family="Virgil, Segoe UI Emoji" font-size="30px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Liusvaara (2017)</text></g></g><g xmlns:ns11="http://www.w3.org/2000/svg" ns11:clip-path="url(#story-frame-5)"><g transform="translate(635.6990661621094 575) rotate(0 174.30093383789062 42.5)"><text x="174.30093383789062" y="29.954" font-family="Virgil, Segoe UI Emoji" font-size="34px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Signatures show if</text><text x="174.30093383789062" y="72.45400000000001" font-family="Virgil, Segoe UI Emoji" font-size="34px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">a pass was changed.</text></g></g><g xmlns:ns12="http://www.w3.org/2000/svg" ns12:clip-path="url(#story-frame-5)"><g stroke-linecap="round"><g transform="translate(1060 617) rotate(0 35 0)"><path d="M0 0 C15.87 1.39, 27.05 -0.93, 70 0 M0 0 C17.56 -0.53, 36.06 0.29, 70 0" stroke="#202020" stroke-width="2" fill="none"/></g><g transform="translate(1060 617) rotate(0 35 0)"><path d="M46.52 8.57 C52.95 8.25, 54.61 4.18, 70 0 M46.52 8.57 C52.13 5.58, 58.64 4.18, 70 0" stroke="#202020" stroke-width="2" fill="none"/></g><g transform="translate(1060 617) rotate(0 35 0)"><path d="M46.5 -8.53 C52.78 -5.35, 54.45 -5.93, 70 0 M46.5 -8.53 C52.04 -7.12, 58.55 -4.1, 70 0" stroke="#202020" stroke-width="2" fill="none"/></g></g><mask/></g><g xmlns:ns13="http://www.w3.org/2000/svg" ns13:clip-path="url(#story-frame-5)"><g transform="translate(1185.5650634765625 575) rotate(0 144.4349365234375 37.5)"><text x="144.4349365234375" y="26.43" font-family="Virgil, Segoe UI Emoji" font-size="30px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Let the gate check</text><text x="144.4349365234375" y="63.93" font-family="Virgil, Segoe UI Emoji" font-size="30px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">passes offline.</text></g></g><g xmlns:ns14="http://www.w3.org/2000/svg" ns14:clip-path="url(#story-frame-5)"><g transform="translate(268.02825927734375 785) rotate(0 531.9717407226562 17.5)"><text x="531.9717407226562" y="24.668" font-family="Virgil, Segoe UI Emoji" font-size="28px" fill="#b4493d" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Published results guided decisions; they were not Private Pass test results.</text></g></g></svg>