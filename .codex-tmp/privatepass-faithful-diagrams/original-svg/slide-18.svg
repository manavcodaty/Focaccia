83.16802978515625" y="108.19200000000001" font-family="Virgil, Segoe UI Emoji" font-size="32px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">and offline gate can work together.</text></g></g><g xmlns:ns11="http://www.w3.org/2000/svg" ns11:clip-path="url(#story-frame-18)"><g transform="translate(993.6640167236328 515) rotate(0 216.3359832763672 80)"><text x="216.3359832763672" y="28.192" font-family="Virgil, Segoe UI Emoji" font-size="32px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">What I cannot claim:</text><text x="216.3359832763672" y="68.19200000000001" font-family="Virgil, Segoe UI Emoji" font-size="32px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Accuracy at scale,</text><text x="216.3359832763672" y="108.19200000000001" font-family="Virgil, Segoe UI Emoji" font-size="32px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">strong anti-spoofing,</text><text x="216.3359832763672" y="148.192" font-family="Virgil, Segoe UI Emoji" font-size="32px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">readiness for public events.</text></g></g><g xmlns:ns12="http://www.w3.org/2000/svg" ns12:clip-path="url(#story-frame-18)"><g transform="translate(274.544189453125 710) rotate(0 525.455810546875 20)"><text x="525.455810546875" y="28.192" font-family="Virgil, Segoe UI Emoji" font-size="32px" fill="#202020" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Private Pass shows this approach is possible in a prepared setup.</text></g></g><g xmlns:ns13="http://www.w3.org/2000/svg" ns13:clip-path="url(#story-frame-18)"><g transform="translate(451.51214599609375 785) rotate(0 348.48785400390625 17.5)"><text x="348.48785400390625" y="24.668" font-family="Virgil, Segoe UI Emoji" font-size="28px" fill="#b4493d" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Real tests are still needed before live deployment</text></g></g></svg>