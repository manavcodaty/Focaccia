<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Focaccia template ribbon logo mark">
  <defs>
    <filter id="cellShadow" x="104" y="292" width="816" height="444" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17191c" flood-opacity="0.10"/>
    </filter>
    <style>
      .ink { fill: #17191c; stroke: #17191c; }
      .stone { fill: #a3a6af; stroke: #a3a6af; }
      .rust { fill: #d9562a; stroke: #17191c; }
      .open { fill: #ffffff; stroke: #17191c; }
      .open-stone { fill: #ffffff; stroke: #777b86; }
      .cell { stroke-width: 7; }
    </style>
  </defs>

  <rect width="1024" height="1024" fill="#ffffff" fill-opacity="0"/>

  <g filter="url(#cellShadow)" stroke-linejoin="round">
    <!-- Upper-left incoming hash wave -->
    <rect class="ink cell" x="132" y="361" width="31" height="35" rx="7"/>
    <rect class="ink cell" x="198" y="361" width="25" height="44" rx="8"/>
    <rect class="ink cell" x="265" y="363" width="24" height="48" rx="8"/>
    <rect class="rust cell" x="331" y="378" width="22" height="49" rx="8"/>
    <rect class="rust cell" x="397" y="411" width="20" height="49" rx="8"/>
    <rect class="rust cell" x="462" y="449" width="20" height="49" rx="8"/>

    <rect class="open cell" x="131" y="429" width="24" height="38" rx="7"/>
    <rect class="open-stone cell" x="199" y="426" width="22" height="43" rx="7"/>
    <rect class="open-stone cell" x="267" y="437" width="20" height="44" rx="7"/>
    <rect class="open-stone cell" x="334" y="471" width="20" height="43" rx="7"/>
    <rect class="open-stone cell" x="399" y="511" width="20" height="43" rx="7"/>

    <!-- Lower-left returning hash wave -->
    <rect class="ink cell" x="132" y="629" width="31" height="38" rx="7"/>
    <rect class="ink cell" x="199" y="623" width="25" height="47" rx="8"/>
    <rect class="ink cell" x="267" y="604" width="25" height="48" rx="8"/>
    <rect class="rust cell" x="332" y="576" width="21" height="50" rx="8"/>
    <rect class="rust cell" x="399" y="540" width="20" height="47" rx="8"/>

    <!-- Central fold and crossing bits -->
    <rect class="open cell" x="461" y="522" width="22" height="51" rx="9"/>
    <rect class="rust cell" x="515" y="494" width="21" height="49" rx="8"/>
    <rect class="open cell" x="556" y="517" width="21" height="47" rx="8"/>
    <rect class="open cell" x="599" y="562" width="21" height="48" rx="8"/>
    <rect class="rust cell" x="655" y="604" width="22" height="49" rx="8"/>
    <rect class="rust cell" x="722" y="617" width="25" height="49" rx="8"/>

    <!-- Upper path into loop -->
    <rect class="open cell" x="557" y="442" width="20" height="45" rx="8"/>
    <rect class="open-stone cell" x="611" y="397" width="21" height="43" rx="8"/>
    <rect class="open cell" x="667" y="363" width="22" height="44" rx="8" transform="rotate(-5 678 385)"/>
    <rect class="open cell" x="726" y="342" width="24" height="47" rx="8"/>
    <rect class="open cell" x="786" y="345" width="25" height="46" rx="8" transform="rotate(9 798.5 368)"/>
    <rect class="open cell" x="845" y="371" width="24" height="47" rx="8" transform="rotate(26 857 394.5)"/>
    <rect class="rust cell" x="898" y="423" width="27" height="49" rx="8" transform="rotate(75 911.5 447.5)"/>

    <!-- Right loop and lower path -->
    <rect class="open cell" x="906" y="493" width="25" height="54" rx="8" transform="rotate(96 918.5 520)"/>
    <rect class="open-stone cell" x="875" y="563" width="27" height="52" rx="8" transform="rotate(128 888.5 589)"/>
    <rect class="open cell" x="814" y="612" width="25" height="47" rx="8" transform="rotate(154 826.5 635.5)"/>
    <rect class="open cell" x="764" y="626" width="25" height="44" rx="8" transform="rotate(169 776.5 648)"/>

    <!-- Small implied depth cells from the original generated mark -->
    <rect class="stone cell" x="331" y="442" width="18" height="42" rx="7"/>
    <rect class="stone cell" x="610" y="452" width="18" height="42" rx="7"/>
    <rect class="stone cell" x="463" y="578" width="18" height="42" rx="7"/>
  </g>
</svg>
